<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lamina · tests</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; color: #111; background: #fff; }
  table { border-collapse: collapse; margin-bottom: 18px; } td, th { border-bottom: 1px solid #ddd; padding: 4px 10px; text-align: left; }
  .ok { color: #1f7a4d; font-weight: 700; } .ko { color: #c62f29; font-weight: 700; } h2 { margin-top: 28px; }
</style>

<body>
<h1>Lamina — tests</h1>
<p>Moteur comparé aux classeurs d'origine (valeurs non concernées par les corrections), aux formules fermées de la RDM et aux cas limites du feuilleté.</p>
<div id="sum"></div>
<div id="out"></div>
<script src="js/glass.js?v=eeabc458"></script>
<script src="js/roark-calc.js?v=ef057801"></script>
<script src="js/audit.js?v=39f44ffb"></script>
<script src="js/epaisseur-calc.js?v=d1d346e8"></script>
<script src="js/plate-ritz.js?v=825bff98"></script>
<script src="js/predim-calc.js?v=12449c1a"></script>
<script src="js/resistance-calc.js?v=3fd2a163"></script>
<script>
(function () {
  const C = LaminaRoark, GL = LaminaGlass, AU = LaminaAudit;
  const rows = []; let fails = 0, n = 0;
  function check(name, got, exp, tol = 1e-4) {
    const ok = Math.abs(got - exp) <= tol * Math.max(1e-9, Math.abs(exp)) || (exp === 0 && Math.abs(got) < 1e-9);
    n++; if (!ok) fails++;
    rows.push(`<tr><td>${name}</td><td>${Number(got).toPrecision(7)}</td><td>${Number(exp).toPrecision(7)}</td><td class="${ok ? 'ok' : 'ko'}">${ok ? 'OK' : 'ÉCART'}</td></tr>`);
  }
  const title = (t) => rows.push(`<tr><th colspan="4" style="padding-top:14px">${t}</th></tr>`);

  // ------------------------------------------------------------------
  title('A · Classeur « Glass behaviour under different restraints » — données par défaut (portée 3 000, largeur 1 500, t = 16, d1 = 40)');
  const cmp = AU.compare();
  cmp.rows.forEach((r) => {
    const nm = `${r.bc} / ${r.load}`;
    if (r.bc === 'cant' && r.load === 'uni') {
      check(`${nm} : σ corrigée = 6·(q·L²/2)/t² (classeur ${r.s.toFixed(1)} MPa, erreur R28)`, r.ls, 6 * (5e-3 * 3000 ** 2 / 2) / 256);
      check(`${nm} : σ classeur = σ corrigée × b/a`, r.ls * 1500 / 3000, r.s);
    } else if (r.bc === 'fs' && r.load !== 'uni') {
      check(`${nm} : σ d'encastrement`, r.mA, r.s);
      check(`${nm} : flèche sous la charge`, r.lyLoad, r.y, 1e-4);
    } else check(`${nm} : σ`, r.ls, r.s);
    if (!(r.bc === 'fs')) check(`${nm} : y_max`, r.ly, r.y);
  });
  const fsu = cmp.rows.find((r) => r.bc === 'fs' && r.load === 'uni');
  check('fs / uni : y_max (classeur 1/185, exact 1/184,6 — tolérance 0,3 %)', fsu.ly, fsu.y, 3e-3);
  check('4 appuis simples, a/b = 2 : σ (D25)', cmp.plate.ls, cmp.plate.s);
  check('4 appuis simples, a/b = 2 : y (D26)', cmp.plate.ly, cmp.plate.y);

  // ------------------------------------------------------------------
  title('B · Poutre de largeur unité — formules fermées (L = 2 000, D′ = 1e9 N·mm, w = 0,002 N/mm², P = 3 N/mm)');
  const L = 2000, Dp = 1e9, w = 0.002, P = 3;
  let B = C.beam('ss', L, w, 0, 0, Dp);
  check('ss, w : y_max = 5wL⁴/384D', B.ymax.v, 5 * w * L ** 4 / (384 * Dp)); check('ss, w : m_max = wL²/8', B.mpos.v, w * L * L / 8);
  B = C.beam('ss', L, 0, P, L / 2, Dp); check('ss, P milieu : y = PL³/48D', B.ymax.v, P * L ** 3 / (48 * Dp));
  B = C.beam('ss', L, 0, P, 500, Dp); const cc = 500; check('ss, P à L/4 : y_max = P·c·(L²−c²)^1,5/(9√3·L·D)', B.ymax.v, P * cc * (L * L - cc * cc) ** 1.5 / (9 * Math.sqrt(3) * L * Dp), 1e-5);
  B = C.beam('ff', L, w, 0, 0, Dp); check('ff, w : y_max = wL⁴/384D', B.ymax.v, w * L ** 4 / (384 * Dp)); check('ff, w : m_A = −wL²/12', B.MA, -w * L * L / 12); check('ff, w : m travée = wL²/24', B.mpos.v, w * L * L / 24);
  B = C.beam('ff', L, 0, P, L / 2, Dp); check('ff, P milieu : y = PL³/192D', B.ymax.v, P * L ** 3 / (192 * Dp)); check('ff, P milieu : m = PL/8', B.mpos.v, P * L / 8);
  B = C.beam('fs', L, w, 0, 0, Dp); const xi = (1 + Math.sqrt(33)) / 16;
  check('fs, w : m_A = −wL²/8', B.MA, -w * L * L / 8); check('fs, w : m travée = 9wL²/128', B.mpos.v, 9 * w * L * L / 128, 1e-5);
  check('fs, w : y_max = wL⁴·ξ(1−3ξ²+2ξ³)/48D, ξ = (1+√33)/16', B.ymax.v, w * L ** 4 * xi * (1 - 3 * xi * xi + 2 * xi ** 3) / (48 * Dp), 1e-5);
  B = C.beam('fs', L, 0, P, L / 2, Dp); check('fs, P milieu : y_max = PL³/(48√5·D)', B.ymax.v, P * L ** 3 / (48 * Math.sqrt(5) * Dp), 1e-5); check('fs, P milieu : m_A = −3PL/16', B.MA, -3 * P * L / 16); check('fs, P milieu : m sous P = 5PL/32', B.mpos.v, 5 * P * L / 32);
  B = C.beam('fs', L, 0, P, 1800, Dp); check('fs, P à 0,9 L : m sous la charge > |m_A| (anomalie du classeur)', B.mpos.v / Math.abs(B.MA), (1800 ** 2 * 200 * (3 * L - 1800) / (2 * L ** 3)) / (1800 * 200 * (L + 200) / (2 * L * L)));
  B = C.beam('cant', L, 0, P, L, Dp); check('console, P en bout : y = PL³/3D', B.ymax.v, P * L ** 3 / (3 * Dp)); check('console, P en bout : m_A = −PL', B.MA, -P * L);
  B = C.beam('cant', L, w, 0, 0, Dp); check('console, w : y = wL⁴/8D', B.ymax.v, w * L ** 4 / (8 * Dp)); check('console, w : m_A = −wL²/2', B.MA, -w * L * L / 2);

  // ------------------------------------------------------------------
  title('C · Classeur « Effective Thickness - prEN16612 » — 5 plis de 8 mm, intercalaire 1,52 mm, ω = 0,7');
  const e = GL.effective([8, 8, 8, 8, 8], 1.52, 0.7);
  check('h_ef;w (F25)', e.hw, 39.887942370336241);
  [42.793049202159779, 54.549074239395622, 89.067129739315178, 54.549074239395615, 42.793049202159779].forEach((v, k) => check(`h_ef;σ pli ${k + 1} (F${26 + k})`, e.hs[k], v));
  const e0 = GL.effective([8, 10], 1.52, 0), e1 = GL.effective([8, 10], 0, 1);
  check('ω = 0 : h_ef;w = (Σh³)^(1/3)', e0.hw, Math.cbrt(8 ** 3 + 10 ** 3)); check('ω = 0 : h_ef;σ,1 = √(Σh³/h₁)', e0.hs[0], Math.sqrt((8 ** 3 + 10 ** 3) / 8));
  check('ω = 1, sans intercalaire : h_ef;w = Σh', e1.hw, 18); check('ω = 1, sans intercalaire : h_ef;σ = Σh', e1.hs[1], 18);
  const as = AU.asym(); check('2 plis 8/12, option centre de gravité : h_m,1 = h_s·h₂/(h₁+h₂)', as.cg.hm[0], (0.5 * (8 + 12) + 1.52) * 12 / 20);
  check('2 plis 8/12, plan de symétrie : h_m,1 = (h₁+h_int+h₂)/2 − h₁/2', as.geo.hm[0], (8 + 1.52 + 12) / 2 - 4);
  const xo = AU.XLE[1], eo = GL.effective(xo.plies, 1.52, 0.7, 'geo');
  check('copie OneDrive 3 × 8 mm : h_ef;w (F25)', eo.hw, xo.hw, 1e-9); xo.hs.forEach((v, k) => check(`copie OneDrive : h_ef;σ,${k + 1} (F${26 + k})`, eo.hs[k], v, 1e-9));

  // ------------------------------------------------------------------
  title('C2 · EN 19100-2 annexe A (EET) et ω par cas de charge');
  const g2 = GL.geometry([10, 10], 1.52, 'geo');
  const I3 = 2000, d = 5.76, S2 = 2 * 10 * d * d, If = I3 + 12 * S2;
  check('η = 0 : h_ef;w = (Σh³)^(1/3) (plis libres)', GL.effectiveEET(g2, 0).hw, Math.cbrt(I3));
  check('η = 1 : h_ef;w = (Σh³ + 12Σh·d²)^(1/3) (monolithe)', GL.effectiveEET(g2, 1).hw, Math.cbrt(If));
  check('η = 1 : ω équivalent (A.1) = 1', GL.effectiveEET(g2, 1).w, 1);
  const P5 = GL.psiPlateSS4(500, 1000); check('Ψ_p tableau A.1 (4 appuis simples) : λ = 0,5, b = 1000', P5.psi * 1e6, 49.9366);
  check('Ψ_p tableau A.1 : λ = 0,5, b = 500 → 199,746 (mise à l’échelle en 1/b²)', GL.psiPlateSS4(250, 500).psi * 1e6, 199.746, 1e-4);
  check('Ψ_p ≈ π²(1/a² + 1/b²) à λ = 1 (ordre de grandeur, 1 %)', GL.psiPlateSS4(1000, 1000).psi, Math.PI ** 2 * 2e-6, 1e-2);
  const psi = GL.psiPlateSS4(1500, 3000).psi, et = GL.etaEET(g2, 50, psi, 'plate', 70000, 0.23);
  check('η (A.4), 10/1,52/10, G = 50 MPa, 1500 × 3000', et.eta, 1 / (1 + 1.52 * 70000 / (50 * (1 - 0.23 ** 2)) * (I3 / If) * 5 * psi));
  const ee = GL.effectiveEET(g2, et.eta), ew = GL.effective([10, 10], 1.52, ee.w, 'geo');
  check('cohérence (A.1) : EN 16612 avec ω équivalent redonne h_ef;w EET', ew.hw, ee.hw, 1e-9);
  const eb2 = GL.etaEET(g2, 3, 168 / (17 * 2000 ** 2), 'beam'), hh = 10, ti = 1.52;
  check('poutre 2 plis égaux : forme générale = (A.8) n = 2', eb2.eta, 1 / (1 + ti * 70000 / (12 * 3) * (2 * hh ** 3 * 3 / (hh ** 2 + (hh + ti) ** 2 * 3)) * 168 / (17 * 2000 ** 2)));
  check('G = 0 : η = 0', GL.etaEET(g2, 0, psi, 'plate').eta, 0);
  check('plaque 4 plis : hors domaine de l’annexe A', GL.etaEET(GL.geometry([8, 8, 8, 8], 1.52), 50, psi, 'plate').err ? 1 : 0, 1);
  const E0 = LaminaEpaisseur.compute(LaminaEpaisseur.defaultState());
  check('onglet par défaut (3 × 8 SentryGlas, vent ω = 0,7) = copie OneDrive du classeur', E0.rows.find((r) => r.L.id === 'W').hw, AU.XLE[1].hw, 1e-9);
  const spv = LaminaEpaisseur.defaultState(); spv.il = 'pvb';
  const Ep = LaminaEpaisseur.compute(spv);
  check('FD P78-468 tableau 32, PVB : ligne neige composant intérieur, ω = 0', Ep.rows.find((r) => r.key === 'S_int').w, 0);
  check('FD P78-468 tableau 32, PVB : ligne neige extérieur ou simple, ω = 0,2', Ep.rows.find((r) => r.key === 'S_ext').w, 0.2);
  check('FD P78-468 tableau 32, PVB : hiver dédoublé (0,2 ext. / 0 int.)', Ep.rows.find((r) => r.key === 'H_ext').w + 10 * Ep.rows.find((r) => r.key === 'H_int').w, 0.2);
  const sgs = LaminaEpaisseur.defaultState(); sgs.eet.load = 'S_int';
  check('EET SentryGlas, neige composant intérieur : G = 12 MPa (DTA)', LaminaEpaisseur.compute(sgs).eet.G, 12);
  check('FD P78-468 tableau 32, PVB : ω vent = 0,3', Ep.rows.find((r) => r.L.id === 'W').w, 0.3);
  check('DTA SentryGlas Xtra : ω été ≤ 50 °C joint = 0,85', GL.pick(GL.INTERLAYER.sgx.w.Ej, 'ext'), 0.85);
const pv = LaminaEpaisseur.defaultState(); pv.il = 'pvb';  check('PVB sans G saisi : méthode EET sans résultat (G à saisir)', LaminaEpaisseur.compute(pv).eet.err ? 1 : 0, 1);  pv.eet.G = 0.5; check('PVB avec G = 0,5 MPa saisi : η = G/(G + G*)', LaminaEpaisseur.compute(pv).eet.eta > 0 && LaminaEpaisseur.compute(pv).eet.eta < 1 ? 1 : 0, 1);  const v1e = LaminaEpaisseur.upgrade({ v: 1, il: 'pvb', plies: [{ h: 8 }, { h: 8 }], hints: [1.52], eet: { on: true, cas: 'ss4', a: 1500, b: 3000, gSrc: 'il', load: 'W', G: 50 } });  check('ancien état : G = 50 MPa par défaut vidé', v1e.eet.G === '' ? 1 : 0, 1);

  // ------------------------------------------------------------------
  title('D · « Glass Strength Spreadsheet » (prEN 16612) — 50 ans, float, durci, trempe horizontale');
  check('k_mod 50 ans (D16)', GL.kmodOf(438000), 0.29438887674662917);
  const res = { surface: 'float', fgk: 45, gMA: 1.8, gMv: 1.2, ke: 1, kv: 1 };
  check('f_g;d durci (D34)', GL.fgd(res, 'durci', GL.kmodOf(438000)).v, 28.193055251999063);
  check('k_mod 10 min = 0,74', GL.kmodOf(10 / 60), 0.663 * Math.pow(1 / 6, -1 / 16));
  check('f_g;d trempé, vent 10 min', GL.fgd(res, 'trempe', GL.kmodOf(10 / 60)).v, GL.kmodOf(10 / 60) * 45 / 1.8 + 75 / 1.2);
  check('f_g;d recuit, imprimé (k_sp = 0,75), 50 ans', GL.fgd(Object.assign({}, res, { surface: 'imprime' }), 'recuit', GL.kmodOf(438000)).v, 0.29438887674662917 * 0.75 * 45 / 1.8);
  check('k_mod borné à 1 (3 s)', GL.kmodOf(3 / 3600), 1);

  // ------------------------------------------------------------------
  title('D2 · FD P78-468 tableau 31 (γ_M;A = γ_M;v = 1,5, k_mod du tableau 25, valeurs arrondies à 0,1 MPa)');
  const fdr = (o) => Object.assign({ surface: 'float', fgk: 45, gMA: 1.5, gMv: 1.5, ke: 1, kv: 1, gRef: 'fd' }, o || {});
  const km = (id) => GL.DURATION[id].kmod;
  check('trempé, vent (W) : 80,0', GL.fgd(fdr(), 'trempe', km('fdW')).v, 80, 1e-3);
  check('trempé, G : 58,7', GL.fgd(fdr(), 'trempe', km('fdG')).v, 58.7, 1e-3);
  check('trempé avec k_e = 0,8 saisi : k_e sans effet sur le verre précontraint (80,0)', GL.fgd(fdr({ ke: 0.8 }), 'trempe', km('fdW')).v, 80, 1e-3);
  check('float recuit, W : 30,0', GL.fgd(fdr(), 'recuit', km('fdW')).v, 30, 1e-3);
  check('float recuit, bord libre brut (k_e = 0,8), W : 24,0', GL.fgd(fdr({ ke: 0.8 }), 'recuit', km('fdW')).v, 24, 1e-3);
  check('float recuit, G + Sk : 13,2', GL.fgd(fdr(), 'recuit', km('fdS')).v, 13.2, 1e-3);
  check('imprimé recuit, G + Sa : 10,8', GL.fgd(fdr({ surface: 'imprime' }), 'recuit', km('fdSa')).v, 10.8, 1e-3);
  check('durci, G : 25,4', GL.fgd(fdr(), 'durci', km('fdG')).v, 25.4, 2e-3);
  check('durci, hiver : 33,8 (k_mod 0,57)', GL.fgd(fdr(), 'durci', km('fdH')).v, 33.8, 2e-3);
  check('trempé chimique, W : 100,0', GL.fgd(fdr(), 'chimique', km('fdW')).v, 100, 1e-3);
  check('float recuit sablé, W : 18,0', GL.fgd(fdr({ surface: 'sable' }), 'recuit', km('fdW')).v, 18, 1e-3);
  const PD = LaminaPredim, RS = LaminaResistance;
  check('flèche FD § 10.5.1 : 3000 × 1500 sur 4 côtés → 1500/60 = 25 mm ≤ 30', PD.compute(PD.defaultState()).rows[1].Rd, 25);
  check('flèche FD § 10.5.2 : console vitrage isolant → b/150 ≤ 50 mm', (() => { const s = PD.defaultState(); s.cas = 's-cant'; s.b = 1100; s.igu = true; return PD.compute(s).rows[1].Rd; })(), 1100 / 150);
  const rs = RS.compute(RS.defaultState()), rW = rs.rows.find((r) => r.dur.id === 'fdW');
  check('onglet Résistance (FD P78-468) : trempé, vent 3 s = 80,0', rW.vals.trempe.v, 80, 1e-9);
  check('onglet Résistance : recuit, poids propre 50 ans = 8,7', rs.rows.find((r) => r.dur.id === 'fdG').vals.recuit.v, 8.7, 1e-3);
  const rq = (id) => rs.rows.find((r) => r.dur.id === id);
  check('EN 19100-1 tableau A.3 : charge d’exploitation (1 semaine) k_mod = 0,45 → trempé 0,45·45/1,5 + 75/1,5', rq('ecQ').vals.trempe.v, 0.45 * 30 + 50, 1e-9);
  check('EN 19100-1 tableau A.3 : garde-corps, foule (5 min) k_mod = 0,77 → recuit 0,77·45/1,5', rq('ecF').vals.recuit.v, 0.77 * 30, 1e-9);
  check('EN 19100-1 tableau A.3 : garde-corps, service ordinaire (30 s) k_mod = 0,89', rq('ecP').kmod, 0.89);
  const rsEn = RS.defaultState(); rsEn.gRef = 'en'; rsEn.gMA = 1.8; rsEn.gMv = 1.2;
  check('onglet Résistance (NF EN 16612) : trempé, vent 3 s = 25 + 62,5', RS.compute(rsEn).rows.find((r) => r.dur.id === 'fdW').vals.trempe.v, 45 / 1.8 + 75 / 1.2);
  check('onglet Résistance : durcis émaillés sans f_b;k chimique → « non disponible »', (() => { const s = RS.defaultState(); s.surface = 'emaille'; return RS.compute(s).rows[0].vals.chimique === null ? 1 : 0; })(), 1);

  // ------------------------------------------------------------------
  title('E · Pré-dimensionnement (une ligne par cas de charge)');
  const R0 = PD.compute(PD.defaultState());
  check('état par défaut valide, 2 lignes calculées', R0.valid && R0.rows.every((o) => !o.err) ? 1 : 0, 1);
  check('ELU 4 appuis simples, a/b = 2 : σ = β·q·b²/h² (h = 18,06)', R0.rows[0].Ed, 0.6102 * 1.8e-3 * 1500 ** 2 / 18.06 ** 2);
  check('ELS : y = α·q·b⁴/(E·h³) (h = 16,37)', R0.rows[1].Ed, 0.111 * 1.2e-3 * 1500 ** 4 / (70000 * 16.37 ** 3));
  const sc = PD.defaultState(); Object.assign(sc, { cas: 's-cant', a: 1000, b: 1100 }); sc.rows = [{ name: 'MC', st: 'uls', load: 'line', val: 1.5, d: '', beff: '', h: 15, f: 80 }];
  check('garde-corps console 1,1 m, 1,5 kN/m en tête : σ = 6·p·b/h²', PD.compute(sc).rows[0].Ed, 6 * 1.5 * 1100 / 225);
  const sp = PD.defaultState(); Object.assign(sp, { cas: 's-ss', a: 1200, b: 2000 }); sp.rows = [{ name: 'P', st: 'uls', load: 'point', val: 1, d: '', beff: 600, h: 12, f: 80 }];
  check('bande, P = 1 kN au milieu sur b_eff = 600 : σ = 6·(P/b_eff)·L/4/h²', PD.compute(sp).rows[0].Ed, 6 * (1000 / 600) * 2000 / 4 / 144);
  const mix = PD.defaultState(); Object.assign(mix, { cas: 's-ss', a: 1000, b: 2000 });
  mix.rows = [{ st: 'uls', load: 'uni', val: 1, h: 12, f: 80 }, { st: 'uls', load: 'line', val: 1, d: 500, h: 12, f: 80 }, { st: 'sls', load: 'point', val: 1, d: '', beff: 1000, h: 12, lim: 100 }];
  const Rmix = PD.compute(mix);
  check('lignes de types différents : pression → wL²/8', Rmix.rows[0].Ed, 6 * 1e-3 * 2000 ** 2 / 8 / 144);
  check('lignes de types différents : linéique à d = 500 → p·d·(L−d)/L', Rmix.rows[1].Ed, 6 * 1 * 500 * 1500 / 2000 / 144);
  check('lignes de types différents : ponctuelle, flèche P·L³/48D', Rmix.rows[2].Ed, 1 * L ** 0 * 2000 ** 3 / (48 * 70000 * 1728 / 12), 1e-5);
  const bad = PD.defaultState(); bad.rows[0].load = 'line';
  check('charge linéique sur plaque 4 côtés : ligne signalée non disponible', PD.compute(bad).rows[0].err ? 1 : 0, 1);
  const v1 = { kind: 'vitrage', v: 1, cas: 'c1', load: 'uni', a: 3000, b: 1500, comp: { mode: 'mono', t: 12, temper: 'trempe' }, mat: { E: 70000, nu: 0.22 }, res: { mode: 'en16612', gMA: 1.8, gMv: 1.2, surface: 'float', fgk: 45, ke: 1, kv: 1 }, pos: {}, uls: [{ name: 'Vent', q: 1.5, dur: 'fdW' }], sls: [{ name: 'Vent ELS', q: 1, lim: 150, max: '' }] };
  const up = PD.upgrade(JSON.parse(JSON.stringify(v1)));
  check('ancien calcul « Roark » : 2 lignes reprises, h = t = 12', up.rows.length === 2 && up.rows[0].h === 12 && up.rows[1].h === 12 ? 1 : 0, 1);
  check('ancien calcul : f_g;d repris avec ses γ (NF EN 16612, vent 3 s, trempé)', up.rows[0].f, Math.round((45 / 1.8 + 75 / 1.2) * 10) / 10);
  check('ancien calcul : critère de flèche saisi conservé (b/150)', PD.compute(up).rows[1].Rd, 10);

  // ------------------------------------------------------------------
  title('F · Champ de plaque par Ritz (visualisation) comparé à Roark, ν = 0,3, h = 10 mm');
  const RZ = LaminaRitz, rz = (edges, a, b, N, nu = 0.3) => RZ.solve({ a, b, E: 70000, nu, h: 10, edges, load: 'uni', q: 1e-3, N });
  const kS = (s, b) => s * 100 / (1e-3 * b * b), kW = (w, b) => w * 70000 * 1000 / (1e-3 * b ** 4);
  let Z = rz({ bottom: 'ss', top: 'ss', left: 'ss', right: 'ss' }, 3000, 1500, 10);
  check('4 appuis simples, a/b = 2 : β = 0,6102', kS(Z.at(1500, 750).sy, 1500), 0.6102, 2e-3);
  check('4 appuis simples, a/b = 2 : α = 0,1110', kW(Z.at(1500, 750).w, 1500), 0.1110, 6e-3);
  Z = rz({ bottom: 'fx', top: 'fx', left: 'fx', right: 'fx' }, 3000, 1500, 12);
  check('4 côtés encastrés, a/b = 2 : β₁ = 0,4974 (milieu des grands côtés)', -kS(Z.at(1500, 0).sy, 1500), 0.4974, 5e-3);
  check('4 côtés encastrés, a/b = 2 : α = 0,0277', kW(Z.at(1500, 750).w, 1500), 0.0277, 1e-2);
  Z = rz({ bottom: 'ss', top: 'ss', left: 'ss', right: 'fr' }, 1500, 1500, 12);
  const Zg = Z.grid(30, 30);
  check('3 appuis simples + bord libre, a/b = 1 : β = 0,67', kS(Zg.sMax.v, 1500), 0.67, 1e-2);
  check('3 appuis simples + bord libre, a/b = 1 : α = 0,140', kW(Zg.wMax.v, 1500), 0.140, 1e-2);
  document.getElementById('sum').innerHTML = `<p class="${fails ? 'ko' : 'ok'}">${n - fails} / ${n} tests réussis</p>`;
  document.getElementById('out').innerHTML = `<table><thead><tr><th>Test</th><th>Calculé</th><th>Attendu</th><th></th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
  window.LAMINA_TESTS = { n, fails };
})();
